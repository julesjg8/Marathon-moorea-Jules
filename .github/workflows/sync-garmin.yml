name: Synchro Garmin
on:
  schedule:
    - cron: '0 19 * * *'  # tous les jours à 9 h, heure de Polynésie (UTC-10) : données de la nuit
    - cron: '0 6 * * *'   # tous les jours à 20 h, heure de Polynésie (UTC-10)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: sync-garmin
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer les donnees Garmin
        shell: pwsh
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: ./scripts/sync-garmin.ps1
      - name: Enregistrer data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Synchro Garmin $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Une autre synchro a pu publier data.json entre-temps : on garde la plus récente (celle-ci).
            git pull --rebase --autostash -X theirs
            git push
          fi
      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier le site
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Publier le site (2e essai si GitHub a eu un raté)
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - name: Publier le site (2e essai)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Garder la synchro active
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-garmin.yml/enable"
