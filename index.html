<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marathon">
<title>Prépa Marathon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Before the first paint: apply the saved theme (or the phone's own setting), and ask for the
// data right away so that it downloads while the scripts load.
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#f4f3ef';
  window.DATA_READY = fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
  window.DATA_READY.catch(function () {}); // handled again below; this only silences the early warning
})();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="preload" href="app.js" as="script">
</head>
<body>
<div id="app"><div class="boot"><span class="spinner"></span>Chargement de tes données…</div></div>
<script src="config.js"></script>
<script src="data/laps.js" onerror="window.GARMIN_LAPS={}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="fit.js"></script>
<script src="plan.js"></script>
<script src="score.js"></script>
<script>
// The Garmin data lives in data.json, refreshed by GitHub Actions. Once it is there, app.js
// builds the page. Real watch laps (data/laps.js) take precedence over the rebuilt ones.
(function () {
  var app = document.getElementById('app');
  function fail(msg) {
    app.innerHTML = '<div class="wrap"><div class="empty"><h2>Oups, un souci d\'affichage</h2><p></p><button type="button" class="btn primary" onclick="location.reload()">Réessayer</button></div></div>';
    app.querySelector('p').textContent = msg;
  }
  // An error while the page is being built would leave the loader spinning for ever
  window.addEventListener('error', function (e) { if (app.querySelector('.boot')) fail(e.message || 'Erreur inconnue.'); });
  window.DATA_READY.then(function (d) {
    window.GARMIN_DATA = d;
    window.GARMIN_LAPS = Object.assign({}, d.laps, window.GARMIN_LAPS);
  }).catch(function (e) {
    console.error('data.json introuvable ou illisible :', e);
    window.GARMIN_DATA_MISSING = true;
  }).then(function () {
    var s = document.createElement('script');
    s.src = 'app.js';
    s.onerror = function () { fail('Le fichier app.js n\'a pas pu être chargé.'); };
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
